<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Подключаем шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Pacifico&display=swap"
      rel="stylesheet"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yumly</title>

    <!--
      GitHub Pages не поддерживает SPA-маршрутизацию напрямую.
      При открытии динамического URL (например, /Lerka2) сервер возвращает 404.html,
      который перенаправляет пользователя на главную страницу, сохраняя исходный путь
      в параметре `p`.

      Здесь восстанавливаем исходный URL до запуска React,
      чтобы BrowserRouter мог определить нужный маршрут.
    -->
    <script>
      const params = new URLSearchParams(window.location.search);
      const redirectPath = params.get('p');

      // Возвращаем исходный URL, убирая служебный параметр `p`.
      // replaceState изменяет адрес без перезагрузки страницы.
      if (redirectPath) {
        window.history.replaceState(null, '', redirectPath);
      }
    </script>
    <!-- конец части кода, которая вставлена для корректной маршрутизации на GitHub Pages -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
